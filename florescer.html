<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Florescer Nutrição Fértil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#F3EEE6;--surface:#FBF8F3;--surface2:#EFE8DD;--ink:#1A1714;--muted:#7B7166;--line:#E2D8CA;
  --brand:#A8834F;--brand-ink:#FBF8F3;--brand-soft:#F1E7D6;--sage:#6E7B5C;--sage-soft:#E6E8DC;
  --gold:#B8925A;--gold-soft:#F3E9D7;--danger:#A9473A;--danger-soft:#F4E1DC;--blue:#4F6E86;--blue-soft:#E2E8EC;
  --night:#15120F;--night2:#211D18;--night-ink:#F1E9DC;--night-muted:#A0968A;--night-line:#2F2A23;
  --serif:'Playfair Display',Georgia,serif;--r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12100D;--surface:#1B1814;--surface2:#24201B;--ink:#EFE7DA;--muted:#9C9284;--line:#332D26;
  --brand:#C9A46B;--brand-ink:#12100D;--brand-soft:#2E261B;--sage:#A3B08C;--sage-soft:#242A1F;
  --gold:#D1AE72;--gold-soft:#2F281C;--danger:#D98274;--danger-soft:#3A231F;--blue:#8FB0C7;--blue-soft:#1D262D;
  --night:#0B0907;--night2:#17140F;--night-line:#2A251E;
}}
:root[data-theme="dark"]{
  --bg:#12100D;--surface:#1B1814;--surface2:#24201B;--ink:#EFE7DA;--muted:#9C9284;--line:#332D26;
  --brand:#C9A46B;--brand-ink:#12100D;--brand-soft:#2E261B;--sage:#A3B08C;--sage-soft:#242A1F;
  --gold:#D1AE72;--gold-soft:#2F281C;--danger:#D98274;--danger-soft:#3A231F;--blue:#8FB0C7;--blue-soft:#1D262D;
  --night:#0B0907;--night2:#17140F;--night-line:#2A251E;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:-.005em}
h1{font-size:36px;line-height:1.12}h2{font-size:21px}h3{font-size:17px}
h1 em,h2 em{font-style:italic;color:var(--brand)}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
.eyebrow{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--brand);font-weight:600;margin-bottom:10px;display:block}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--night);color:var(--night-muted);padding:28px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:0 8px 26px;margin-bottom:14px;border-bottom:1px solid var(--night-line)}
.logo-mark{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);flex:none}
.logo b{font-family:var(--serif);font-weight:500;font-size:17px;display:block;line-height:1.2;color:var(--night-ink);letter-spacing:.28em;text-transform:uppercase}
.logo small{color:var(--gold);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase}
.nav{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:3px;color:var(--night-muted);cursor:pointer;border:0;background:none;text-align:left;width:100%;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;border-left:2px solid transparent}
.nav:hover{color:var(--night-ink);background:rgba(255,255,255,.03)}
.nav.on{color:var(--gold);border-left-color:var(--gold);background:linear-gradient(90deg,rgba(184,146,90,.14),transparent)}
.nav svg{width:17px;height:17px;flex:none;stroke-width:1.5}
.side-foot{margin-top:auto;font-size:10.5px;color:var(--night-muted);padding:14px 10px 0;border-top:1px solid var(--night-line);line-height:1.6}
main{padding:36px 40px 70px;min-width:0;max-width:1320px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.top p{margin:8px 0 0;color:var(--muted);max-width:620px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.card h2,.card h3{margin-bottom:14px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:3px}
.kpi .v{font-family:var(--serif);font-size:34px;font-weight:500;line-height:1.1}
.kpi .l{color:var(--muted);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.kpi .s{font-size:12px;color:var(--brand)}
.btn{border:1px solid var(--ink);background:transparent;padding:10px 18px;border-radius:2px;cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center;white-space:nowrap;font-size:11px;letter-spacing:.14em;text-transform:uppercase;transition:.15s;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.pri:not(.sm)::after{content:"→";color:var(--gold);font-size:14px;letter-spacing:0}
.btn.pri:hover{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#15120F}
.btn.gold:hover{filter:brightness(1.08);background:var(--gold);color:#15120F}
.btn.sm{padding:6px 11px;font-size:10px;letter-spacing:.1em}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface2)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.ghost.danger{border-color:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:2px;font-size:9.5px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap;letter-spacing:.12em;text-transform:uppercase}
.b-brand{background:var(--brand-soft);color:var(--brand)}.b-sage{background:var(--sage-soft);color:var(--sage)}
.b-gold{background:var(--gold-soft);color:var(--gold)}.b-danger{background:var(--danger-soft);color:var(--danger)}.b-blue{background:var(--blue-soft);color:var(--blue)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
input[type=color]{padding:2px;height:40px}
textarea{resize:vertical}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form .full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex}
.chk input{display:none}
.chk span{padding:6px 12px;border:1px solid var(--line);border-radius:2px;cursor:pointer;font-size:12.5px;user-select:none;background:var(--surface)}
.chk input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sec-title{font-family:var(--serif);font-size:19px;font-style:italic;margin:26px 0 8px;grid-column:1/-1;padding-bottom:8px;border-bottom:1px solid var(--line);color:var(--ink)}
.sec-title:first-child{margin-top:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:24px 0 24px;overflow-x:auto;scrollbar-width:none}
.tab{padding:12px 14px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-color:var(--gold)}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--night);color:var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:21px;font-weight:500;flex:none;border:1px solid var(--gold)}
.avatar.sm{width:36px;height:36px;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-family:var(--serif);font-style:italic;font-size:15px}
.list-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.progress{height:4px;background:var(--surface2);border-radius:0;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--gold)}
.bar-row{display:grid;grid-template-columns:92px 1fr 110px;gap:10px;align-items:center;font-size:12.5px;margin:8px 0}
.cycle{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:4px;margin:12px 0}
.cday{aspect-ratio:1;border-radius:2px;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--surface2);color:var(--muted);position:relative}
.cday.men{background:var(--danger-soft);color:var(--danger)}
.cday.fer{background:var(--sage-soft);color:var(--sage)}
.cday.ovu{background:var(--sage);color:#fff}
.cday.lut{background:var(--gold-soft);color:var(--gold)}
.cday.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.meal{border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden;background:var(--surface)}
.meal-head{display:flex;gap:10px;align-items:center;padding:12px 16px;background:var(--night);color:var(--night-ink);flex-wrap:wrap}
.meal-head input{width:auto;background:transparent;border-color:transparent;padding:4px 6px;color:var(--night-ink)}
.meal-head input:not([type=time]){font-family:var(--serif);font-size:17px}
.meal-head input[type=time]{color:var(--gold);font-weight:600;color-scheme:dark}
.meal-head input:hover,.meal-head input:focus{border-color:var(--night-line);box-shadow:none}
.meal-head .muted{color:var(--night-muted)}
.meal-head .btn.ghost{color:var(--night-muted)}
.meal-head .btn.ghost:hover{background:var(--night2);color:var(--night-ink)}
.meal table td{padding:7px 10px}
.meal table input{padding:5px 7px;min-width:64px}.meal table td:nth-child(2) input{min-width:120px}
.add-row{display:grid;grid-template-columns:1fr 90px 150px auto;gap:8px;padding:12px 16px;border-top:1px dashed var(--line)}
.tag{font-size:9px;padding:2px 7px;border-radius:2px;font-weight:600;white-space:nowrap;letter-spacing:.08em;text-transform:uppercase}
.score-q{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg label{cursor:pointer}
.seg input{display:none}
.seg span{display:block;padding:6px 11px;font-size:11px;border-left:1px solid var(--line)}
.seg label:first-child span{border-left:0}
.seg input:checked+span{background:var(--ink);color:var(--bg)}
.timeline{border-left:1px solid var(--line);margin-left:8px;padding-left:22px}
.tl{position:relative;padding-bottom:20px}
.tl:before{content:"";position:absolute;left:-28px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:1px solid var(--brand)}
.tl.marco:before{background:var(--gold);border-color:var(--gold)}
.alert{display:flex;gap:10px;padding:11px 14px;border-radius:2px;background:var(--surface2);margin-bottom:8px;font-size:13px;align-items:flex-start;border-left:2px solid var(--line)}
.alert.warn{background:var(--gold-soft);border-left-color:var(--gold)}.alert.bad{background:var(--danger-soft);border-left-color:var(--danger)}.alert.good{background:var(--sage-soft);border-left-color:var(--sage)}
.modal{position:fixed;inset:0;background:rgba(15,12,9,.6);display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
.modal.hidden{display:none}
.modal-box{background:var(--surface);border-radius:var(--r);width:min(740px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal-head{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-head h2{font-size:24px}
.modal-body{padding:22px 26px}
.modal-foot{padding:16px 26px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--night);color:var(--night-ink);padding:12px 20px;border-radius:2px;border-left:2px solid var(--gold);transition:.25s;z-index:60;font-weight:500;opacity:0;font-size:13px}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.phase-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.hero-success{background:var(--night);border-color:var(--night);color:var(--night-ink)}
.hero-success .l{color:var(--night-muted)}.hero-success .s{color:var(--gold)}.hero-success .v{color:var(--night-ink)}
.lab-flag{font-weight:600}
.lab-flag.lo,.lab-flag.hi{color:var(--danger)}
.lab-flag.ok{color:var(--sage)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px;min-height:160px}
.wday.today{border-color:var(--gold);box-shadow:inset 0 2px 0 var(--gold)}
.wday h4{margin:0 0 10px;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.appt{background:var(--night);color:var(--night-ink);border-left:2px solid var(--gold);border-radius:2px;padding:7px 9px;font-size:11.5px;margin-bottom:6px;cursor:pointer}
.appt.done{background:var(--sage-soft);color:var(--ink);border-left-color:var(--sage)}.appt.miss{background:var(--surface2);text-decoration:line-through;color:var(--muted);border-left-color:var(--line)}
.appt b{display:block;font-weight:600}
canvas{max-width:100%}
/* hero do painel */
.hero{background:radial-gradient(120% 140% at 100% 0%,rgba(184,146,90,.22),transparent 55%),var(--night);color:var(--night-ink);border-radius:var(--r);padding:40px 40px 0;margin-bottom:22px;overflow:hidden}
.hero h1{font-size:44px;color:var(--night-ink)}
.hero h1 em{color:var(--gold)}
.hero p{color:var(--night-muted);margin:10px 0 0}
.hero .btn{border-color:var(--night-ink);color:var(--night-ink)}
.hero .btn:hover{background:var(--night-ink);color:var(--night)}
.hero .btn.gold{border-color:var(--gold);color:#15120F}
.hero-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:34px;border-top:1px solid var(--night-line)}
.hero-stat{display:flex;gap:14px;align-items:center;padding:22px 20px 26px;border-left:1px solid var(--night-line)}
.hero-stat:first-child{border-left:0;padding-left:0}
.hero-stat .ic{width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);flex:none}
.hero-stat .ic svg{width:18px;height:18px}
.hero-stat .v{font-family:var(--serif);font-size:28px;line-height:1.05}
.hero-stat .l{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--night-muted);font-weight:600}
.hero-stat .s{font-size:11.5px;color:var(--gold)}
/* depoimentos */
.quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px;cursor:pointer}
.quote:hover{border-color:var(--gold)}
.stars{color:var(--gold);letter-spacing:.2em;font-size:13px}
.quote blockquote{margin:0;font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.5}
.section-head{text-align:center;margin:40px 0 22px}
.section-head h2{font-size:28px}
@media (max-width:1100px){.hero-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-stat:nth-child(3){border-left:0;padding-left:0}}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:8px 10px;z-index:20}
  .logo,.side-foot{display:none}
  .nav{width:auto;white-space:nowrap;padding:9px 10px;border-left:0;border-bottom:2px solid transparent}
  .nav.on{border-bottom-color:var(--gold)}
  #nav{display:flex;gap:2px}
  main{padding:20px 16px 60px}
  h1{font-size:28px}.hero{padding:26px 20px 0}.hero h1{font-size:32px}
  .hero-stats{grid-template-columns:1fr}.hero-stat{border-left:0;padding-left:0;border-top:1px solid var(--night-line)}
  .g2,.form{grid-template-columns:1fr}
  .add-row{grid-template-columns:1fr 1fr}
  .week{grid-template-columns:1fr}
}
#print{display:none}
@media print{
  body{background:#fff;color:#1A1714}
  .app,.modal,#toast{display:none!important}
  #print{display:block;font:12px/1.55 Inter,sans-serif}
  #print h1{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:24px;letter-spacing:.2em;text-transform:uppercase}
  #print .ph{display:flex;justify-content:space-between;border-bottom:1px solid #B8925A;padding-bottom:12px;margin-bottom:18px}
  #print .pm{margin-bottom:16px;break-inside:avoid}
  #print .pm h3{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:16px;border-bottom:1px solid #E2D8CA;padding:0 0 4px;margin-bottom:6px;color:#1A1714}
  #print ul{margin:0;padding-left:20px}
  #print .pf{margin-top:28px;border-top:1px solid #E2D8CA;padding-top:8px;color:#7B7166;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">
      <div class="logo-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 21v-8"/><path d="M12 13c0-4 3-7 7-7 0 4-3 7-7 7z"/><path d="M12 15c0-3.3-2.7-6-6-6 0 3.3 2.7 6 6 6z"/></svg></div>
      <div><b id="brand-name">Florescer</b><small id="brand-sub">Nutrição Fértil</small></div>
    </div>
    <div id="nav"></div>
    <div class="side-foot" id="sync"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="modal-box" id="modal-box"></div></div>
<div id="print"></div>
<div id="toast"></div>

<script>
/* ============ ÍCONES ============ */
const I={
 dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
 pac:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5.5"/>',

const PAGES_URL='https://admmateusalmeida-hue.github.io/florescer-nutricao-fertil/';
const C={url:'',key:'',sheet:'',version:0,timer:null,saving:false,dirty:false,status:'local',at:''};
try{const c=JSON.parse(localStorage.getItem(KEY+'_cloud')||'{}');C.url=c.url||window.FLORESCER_API||'';C.key=c.key||'';C.sheet=c.sheet||'';C.version=+c.version||0}catch(e){C.url=window.FLORESCER_API||''}
const cloudOn=()=>!!(C.url&&C.key);
const hhmm=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
function cloudPersist(){try{localStorage.setItem(KEY+'_cloud',JSON.stringify({url:C.url,key:C.key,sheet:C.sheet,version:C.version}))}catch(e){}}
async function cloudCall(action,body={}){
 const r=await fetch(C.url,{method:'POST',body:JSON.stringify({action,key:C.key,...body})});
 const j=await r.json();if(!j.ok&&!j.conflict)throw new Error(j.error||'Erro na nuvem');return j}
function syncUI(){const el=$('#sync');if(!el)return;el.innerHTML={
 local:'Os dados ficam salvos só neste navegador.<br>Conecte o Google Drive em Configurações.',
 ok:`<span style="color:var(--gold)">●</span> Salvo no Google Drive${C.at?' · '+C.at:''}`,
 saving:'<span style="color:var(--gold)">○</span> Salvando no Google Drive…',
 erro:'<span style="color:var(--danger)">●</span> Sem conexão com a nuvem.<br>Tentando de novo em instantes…'}[cloudOn()?C.status:'local']}
function cloudSchedule(){if(!cloudOn())return;C.dirty=true;C.status='saving';syncUI();clearTimeout(C.timer);C.timer=setTimeout(cloudSave,1200)}
async function cloudSave(){
 if(!cloudOn())return;
 if(C.saving){clearTimeout(C.timer);C.timer=setTimeout(cloudSave,1500);return}
 C.saving=true;C.dirty=false;
 try{
  const j=await cloudCall('save',{state:S,baseVersion:C.version});
  if(j.conflict){C.saving=false;alert('Os dados foram alterados em outro computador. A plataforma vai carregar a versão mais recente do Google Drive.');await cloudLoad(true);return}
  C.version=j.version;cloudPersist();if(!C.dirty){C.status='ok';C.at=hhmm()}
 }catch(e){C.status='erro';C.dirty=true;clearTimeout(C.timer);C.timer=setTimeout(cloudSave,10000)}
 C.saving=false;syncUI()}
async function cloudLoad(force){
 const j=await cloudCall('load');
 if(j.sheetUrl&&j.sheetUrl!==C.sheet){C.sheet=j.sheetUrl;cloudPersist()}
 if(!j.state||!Array.isArray(j.state.pacientes)){const r=await cloudCall('save',{state:S,force:true});C.version=r.version;cloudPersist();toast('Seus dados foram enviados para o Google Drive')}
 else if(force||j.version!==C.version){S=normalize(Object.assign(defaultState(),j.state));C.version=j.version;cloudPersist();localSave();force=true}
 const n=importBookings(j.bookings||[]);
 if(!C.dirty){C.status='ok';C.at=hhmm()}
 syncUI();if(force||n)render()}
function cloudRefresh(){
 if(!cloudOn()||C.dirty||C.saving)return;
 if(!$('#modal').classList.contains('hidden'))return;
 const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;
 cloudLoad(false).catch(()=>{C.status='erro';syncUI()})}
async function cloudConnect(){
 const d=readForm($('#cloudf'));C.url=(d.url||'').trim();C.key=(d.key||'').trim();
 if(!C.url||!C.key){toast('Informe a URL e a chave de acesso');return}
 try{toast('Conectando…');await cloudCall('ping');cloudPersist();C.version=-1;await cloudLoad(true);toast('Conectado ao Google Drive')}
 catch(e){C.key='';cloudPersist();alert('Não foi possível conectar: '+e.message)}}
function cloudDisconnect(){if(!confirm('Desconectar este navegador do Google Drive? Os dados continuam salvos no Drive.'))return;C.key='';cloudPersist();syncUI();render()}

 if(f.t==='textarea')inp=`<textarea name="${f.k}" rows="${f.r||3}" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
 else if(f.t==='select')inp=`<select name="${f.k}">${f.o.map(o=>{const[ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${ov==val?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
 else inp=`<input name="${f.k}" type="${f.t||'text'}" value="${esc(val)}" placeholder="${esc(f.ph||'')}" ${f.t==='number'?'step="any"':''}>`;
 return `<label class="field ${f.w||''}"><span>${f.l}</span>${inp}</label>`;

function readForm(el){const o={};el.querySelectorAll('[name]').forEach(i=>{
 if(i.dataset.multi!==undefined){o[i.name]=o[i.name]||[];if(i.checked)o[i.name].push(i.value)}
 else if(i.type==='checkbox')o[i.name]=i.checked;
 else if(i.type==='radio'){if(i.checked)o[i.name]=i.value}
 else if(i.type==='number')o[i.name]=i.value===''?'':+i.value;
 else o[i.name]=i.value});return o}

/* ============ DERIVADOS ============ */
function cycleInfo(p,ref=today()){
 const c=p.ciclo||{};const starts=byDate((c.registros||[]).map(r=>({data:r.inicio}))).map(r=>r.data);
 let len=+c.duracao||28;
 if(starts.length>=2){const ds=[];for(let i=1;i<starts.length;i++){const d=diffDays(starts[i-1],starts[i]);if(d>15&&d<60)ds.push(d)}if(ds.length)len=Math.round(ds.reduce((a,b)=>a+b,0)/ds.length)}
 const dum=last(starts)||c.dum;if(!dum)return null;
 let start=dum;const elapsed=diffDays(start,ref);
 if(elapsed>=len&&elapsed<len*3){start=addDays(start,Math.floor(elapsed/len)*len)}
 const day=diffDays(start,ref)+1;const ov=len-14;const men=+c.menstruacao||5;
 return{start,len,day,ov,men,fertStart:ov-5,fertEnd:ov+1,next:addDays(start,len),ovDate:addDays(start,ov-1),fertDate:addDays(start,ov-6),late:elapsed>=len*3}
}
function weeksIn(p){return p.inicio?Math.max(0,Math.floor(diffDays(p.inicio,today())/7)):0}
function phaseProgress(p){const f=phase(p.fase);if(!f||!p.faseInicio)return null;const w=Math.floor(diffDays(p.faseInicio,today())/7);return{w,tot:f.semanas,pct:Math.min(100,Math.round(w/f.semanas*100))}}
function lastExam(p){return last(byDate(p.exames))}
function examVal(e,k){if(!e)return '';if(k==='homa'){const g=e.v.glic,i=e.v.ins;return g&&i?+(g*i/405).toFixed(2):''}return e.v[k]}
function scorePct(r){if(!r)return null;const v=Object.values(r.resp||{}).map(Number);return Math.round(v.reduce((a,b)=>a+b,0)/(SCORE.length*2)*100)}
function lastAppt(pid){return byDate(S.agenda.filter(a=>a.pid===pid&&a.data<=today()&&a.status!=='Faltou')).pop()}
function nextAppt(pid){return byDate(S.agenda.filter(a=>a.pid===pid&&a.data>=today()&&a.status==='Agendada')).shift()}
function planTotals(pl){const t={kcal:0,c:0,p:0,g:0,f:0,tags:{}};(pl.refeicoes||[]).forEach(m=>m.itens.forEach(it=>{const f=food(it.f);if(!f)return;const k=(+it.g||0)/100;t.kcal+=f.kcal*k;t.c+=f.c*k;t.p+=f.p*k;t.g+=f.g*k;t.f+=f.f*k;f.tags.forEach(x=>t.tags[x]=(t.tags[x]||0)+1)}));return t}
function mealTotals(m){const t={kcal:0,c:0,p:0,g:0};m.itens.forEach(it=>{const f=food(it.f);if(!f)return;const k=(+it.g||0)/100;t.kcal+=f.kcal*k;t.c+=f.c*k;t.p+=f.p*k;t.g+=f.g*k});return t}
function labAlerts(p){const e=lastExam(p);if(!e)return[];return LABS.map(l=>({l,v:examVal(e,l.k)})).filter(x=>{const f=labFlag(x.l,x.v);return f==='lo'||f==='hi'})}

/* ---- Resumo ---- */
function tResumo(p){
 const av=last(byDate(p.avaliacoes));const v=av?imc(av.peso,av.altura):null;
 const sc=last(byDate(p.scores));const ci=cycleInfo(p);const pr=phaseProgress(p);const f=phase(p.fase);
 const lab=labAlerts(p);const nx=nextAppt(p.id);const pl=last(p.planos||[]);
 return `<div class="grid g4">
  <div class="card kpi"><span class="l">Peso / IMC</span><span class="v">${av?n1(av.peso)+' kg':'—'}</span><span class="s">${v?`IMC ${n1(v)} · ${imcClass(v)}`:'sem avaliação'}</span></div>
  <div class="card kpi"><span class="l">Pontuação fértil</span><span class="v">${sc?scorePct(sc)+'%':'—'}</span><span class="s">${sc?'em '+fd(sc.data):'aplique o questionário'}</span></div>
  <div class="card kpi"><span class="l">Meta energética</span><span class="v">${p.meta?.kcal?n0(p.meta.kcal):'—'}</span><span class="s">${p.meta?.kcal?'kcal/dia':'calcule em Gasto energético'}</span></div>
  <div class="card kpi"><span class="l">No método há</span><span class="v">${weeksIn(p)}</span><span class="s">semanas · desde ${fd(p.inicio)}</span></div>
 </div>
 <div class="grid g2" style="margin-top:16px">
  <div class="card"><h2>Fase atual</h2>
   ${f?`<div class="row" style="gap:8px"><i class="phase-dot" style="background:${f.cor};width:12px;height:12px"></i><b>${esc(f.nome)}</b></div><p class="muted" style="margin:6px 0 12px">${esc(f.objetivo)}</p>
   ${pr?`<div class="progress"><i style="width:${pr.pct}%;background:${f.cor}"></i></div><div class="small muted" style="margin-top:6px">Semana ${pr.w+1} de ${pr.tot}${pr.pct>=100?' · hora de avaliar a próxima fase':''}</div>`:''}
   <div class="row" style="margin-top:14px">${S.protocolo.map(x=>`<button class="btn sm ${x.id===p.fase?'pri':''}" onclick="setFase('${p.id}','${x.id}')">${esc(x.nome.split('·')[0].trim())}</button>`).join('')}</div>`:'<div class="empty">Sem fase definida.</div>'}
  </div>
  <div class="card"><h2>Ciclo hoje</h2>
   ${ci&&!ci.late?`<div class="row" style="gap:24px"><div class="kpi"><span class="v">Dia ${ci.day}</span><span class="l">de ~${ci.len} dias</span></div>
   <div class="small"><div>Janela fértil: <b>${fd(ci.fertDate)} a ${fd(addDays(ci.fertDate,6))}</b></div><div>Ovulação estimada: <b>${fd(ci.ovDate)}</b></div><div>Próxima menstruação: <b>${fd(ci.next)}</b></div></div></div>${cycleStrip(ci,true)}`:`<div class="empty">Registre a última menstruação na aba Ciclo.</div>`}
  </div>
 </div>
 <div class="grid g2" style="margin-top:16px">
  <div class="card"><h2>Perfil do casal</h2>
   <div class="small muted">Diagnósticos</div><div class="checks" style="margin:4px 0 12px">${(p.anamnese?.diagnosticos||[]).map(d=>`<span class="badge b-brand">${esc(d)}</span>`).join('')||'<span class="muted">—</span>'}</div>
   <div class="small muted">Tratamentos prévios</div><div class="checks" style="margin:4px 0 12px">${(p.anamnese?.tratamentos||[]).map(d=>`<span class="badge">${esc(d)}</span>`).join('')||'<span class="muted">—</span>'}</div>
   <div class="grid g3" style="gap:8px"><div><div class="small muted">Tentando há</div><b>${p.anamnese?.tentando?p.anamnese.tentando+' meses':'—'}</b></div><div><div class="small muted">Perdas</div><b>${p.anamnese?.abortos??'—'}</b></div><div><div class="small muted">FIVs</div><b>${p.anamnese?.fivs??'—'}</b></div></div>
   ${p.objetivo?`<div class="alert" style="margin-top:14px">💬 <span>${esc(p.objetivo)}</span></div>`:''}
  </div>
  <div class="card"><h2>Pontos de atenção</h2>
   ${lab.map(x=>`<div class="alert bad">🔬 <span><b>${esc(x.l.n)}</b>: ${n1(x.v)} ${x.l.u} (alvo ${labRef(x.l)})</span></div>`).join('')}
   ${!nx?`<div class="alert warn">⏰ <span>Sem retorno agendado. <a href="#" onclick="event.preventDefault();formAppt(null,'${p.id}')">Agendar agora</a></span></div>`:`<div class="alert good">📅 <span>Próxima consulta em <b>${fd(nx.data)}</b> às ${nx.hora||'—'}</span></div>`}
   ${!pl?`<div class="alert warn">🥗 <span>Ainda não tem plano alimentar.</span></div>`:''}
   ${!(p.suplementos||[]).length?`<div class="alert warn">💊 <span>Nenhuma suplementação registrada.</span></div>`:''}
   <div style="margin-top:14px">${p.status==='Gestante'?`<div class="alert good">✦ <span><b>Gestante!</b>${p.resultado?` Beta positivo em ${fd(p.resultado.data)}.`:''}</span></div>`:`<button class="btn pri" onclick="formPositivo('${p.id}')">✦ Registrar gestação</button>`}
   <button class="btn danger ghost" onclick="delPaciente('${p.id}')">Excluir paciente</button></div>
  </div>
 </div>`;
}
function setFase(pid,fid){const p=P(pid);if(p.fase===fid)return;p.fase=fid;p.faseInicio=today();(p.evolucao=p.evolucao||[]).push({id:uid(),data:today(),tipo:'Marco',texto:'Início da '+phase(fid).nome});save();render();toast('Fase atualizada')}
function formPositivo(pid){const p=P(pid);openModal('Registrar gestação ✦',`<div class="form">${F({k:'data',l:'Data do beta positivo',t:'date'},today())}${F({k:'beta',l:'Valor do beta-hCG (opcional)',t:'number'})}${F({k:'forma',l:'Como engravidou',t:'select',o:['Natural','Coito programado','Indução de ovulação','Inseminação (IIU)','FIV']})}${F({k:'obs',l:'Depoimento / observações',t:'textarea',w:'full',ph:'Guarde aqui as palavras dela — vira um case do seu método.'})}</div>`,d=>{
 p.resultado=d;p.status='Gestante';const f4=S.protocolo.find(f=>/gesta/i.test(f.nome));if(f4){p.fase=f4.id;p.faseInicio=d.data}
 (p.evolucao=p.evolucao||[]).push({id:uid(),data:d.data,tipo:'Marco',texto:`Beta positivo! (${d.forma})${d.obs?' — '+d.obs:''}`});toast('Que notícia! Gestação registrada ✦')},'Registrar')}

 return `<div class="card"><form id="anam" class="form" onsubmit="event.preventDefault()">

/* ---- Ciclo ---- */
function cycleStrip(ci,compact){
 let h='<div class="cycle">';const max=compact?ci.len:Math.max(ci.len,ci.day);
 for(let d=1;d<=max;d++){let c=d<=ci.men?'men':d===ci.ov?'ovu':d>=ci.fertStart&&d<=ci.fertEnd?'fer':d>ci.fertEnd?'lut':'';h+=`<div class="cday ${c} ${d===ci.day?'today':''}" title="${fd(addDays(ci.start,d-1))}">${d}</div>`}
 return h+'</div>'+(compact?'':`<div class="legend"><span><i style="background:var(--danger-soft)"></i>Menstruação</span><span><i style="background:var(--surface2)"></i>Folicular</span><span><i style="background:var(--sage-soft)"></i>Janela fértil</span><span><i style="background:var(--sage)"></i>Ovulação estimada</span><span><i style="background:var(--gold-soft)"></i>Lútea</span></div>`);
}
function tCiclo(p){const c=p.ciclo=p.ciclo||{registros:[]};const ci=cycleInfo(p);const regs=byDate(c.registros,'inicio').reverse();
 const fase=ci?(ci.day<=ci.men?'Menstrual':ci.day<ci.fertStart?'Folicular':ci.day<=ci.fertEnd?'Janela fértil':'Lútea'):'';
 const dica={Menstrual:'Foco em ferro e anti-inflamatórios: feijões, folhas escuras, cúrcuma, ômega-3.','Folicular':'Boa fase para proteínas de qualidade, folato e antioxidantes para o folículo em crescimento.','Janela fértil':'Manter hidratação, zinco e selênio; reforçar alimentos ricos em antioxidantes.','Lútea':'Apoio à progesterona: magnésio, vitamina B6, gorduras boas e glicemia estável.'}[fase];
 return `<div class="grid g2">
 <div class="card"><h2>Ciclo atual</h2>
  ${ci?(ci.late?`<div class="alert warn">Último registro é antigo. Adicione a menstruação mais recente.</div>`:`<div class="row" style="gap:28px;margin-bottom:6px"><div class="kpi"><span class="v">Dia ${ci.day}</span><span class="l">Fase ${fase.toLowerCase()}</span></div><div class="small"><div>Duração média: <b>${ci.len} dias</b></div><div>Ovulação estimada: <b>${fd(ci.ovDate)}</b></div><div>Janela fértil: <b>${fd(ci.fertDate)} – ${fd(addDays(ci.fertDate,6))}</b></div><div>Próxima menstruação: <b>${fd(ci.next)}</b></div></div></div>${cycleStrip(ci)}
  <div class="alert good" style="margin-top:14px">🌱 <span><b>Nutrição nesta fase:</b> ${dica}</span></div>`):'<div class="empty">Registre a primeira menstruação para ver o ciclo.</div>'}
  <p class="small muted" style="margin-top:12px">Estimativa pelo método do calendário (ovulação ≈ 14 dias antes da próxima menstruação). Ciclos irregulares exigem confirmação por teste de ovulação ou ultrassom.</p>
 </div>
 <div class="card"><div class="row between"><h2>Registros de menstruação</h2><button class="btn sm pri" onclick="formCiclo('${p.id}')">+ Registrar</button></div>
  <form id="cicloCfg" class="form" style="margin:6px 0 14px" onchange="const d=readForm(this);Object.assign(P('${p.id}').ciclo,d);save();render()">${F({k:'duracao',l:'Duração média informada (dias)',t:'number'},c.duracao||28)}${F({k:'menstruacao',l:'Dias de menstruação',t:'number'},c.menstruacao||5)}</form>
  ${regs.length?`<table><thead><tr><th>Início</th><th>Ciclo</th><th>Sintomas / notas</th><th></th></tr></thead><tbody>${regs.map((r,i)=>{const prev=regs[i+1];return `<tr><td>${fd(r.inicio)}</td><td>${prev?diffDays(prev.inicio,r.inicio)+' dias':'—'}</td><td class="small">${esc(r.obs||'')}</td><td class="num"><button class="btn sm ghost danger" onclick="delCiclo('${p.id}','${r.id}')">✕</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Nenhum registro.</div>'}
 </div></div>`}
function formCiclo(pid){openModal('Registrar menstruação',`<div class="form">${F({k:'inicio',l:'Primeiro dia da menstruação',t:'date'},today())}${F({k:'obs',l:'Sintomas / notas',ph:'Cólica, fluxo, muco, teste de ovulação…'})}</div>`,d=>{if(!d.inicio)return false;const p=P(pid);p.ciclo.registros.push({id:uid(),...d});toast('Ciclo registrado')})}
function delCiclo(pid,id){const p=P(pid);p.ciclo.registros=p.ciclo.registros.filter(r=>r.id!==id);save();render()}

function tAntropo(p){const av=byDate(p.avaliacoes);const l=last(av);const first=av[0];
 if(av.length>1)chart('ch-peso',{type:'line',data:{labels:av.map(a=>fdShort(a.data)),datasets:[{label:'Peso (kg)',data:av.map(a=>a.peso),borderColor:css('--brand'),backgroundColor:css('--brand-soft'),fill:true,tension:.35,pointRadius:4},{label:'Cintura (cm)',data:av.map(a=>a.cintura||null),borderColor:css('--sage'),tension:.35,pointRadius:3,yAxisID:'y2'}]},options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom'}},scales:{y:{title:{display:true,text:'kg'}},y2:{position:'right',grid:{display:false},title:{display:true,text:'cm'}}}}});
 const v=l?imc(l.peso,l.altura):null;const rcq=l&&l.cintura&&l.quadril?l.cintura/l.quadril:null;
 return `<div class="grid g4">
  <div class="card kpi"><span class="l">Peso atual</span><span class="v">${l?n1(l.peso):'—'} <small style="font-size:14px">kg</small></span><span class="s">${first&&l&&first!==l?`${l.peso-first.peso>0?'+':''}${n1(l.peso-first.peso)} kg desde o início`:''}</span></div>
  <div class="card kpi"><span class="l">IMC</span><span class="v">${n1(v)}</span><span class="s">${imcClass(v)}${v&&(v<20||v>25)?' · faixa associada à melhor fertilidade: 20–25':''}</span></div>
  <div class="card kpi"><span class="l">Cintura</span><span class="v">${l?.cintura?n1(l.cintura):'—'} <small style="font-size:14px">cm</small></span><span class="s">${l?.cintura?(l.cintura>=80?'acima de 80 cm: risco metabólico':'adequada'):''}</span></div>
  <div class="card kpi"><span class="l">Relação cintura/quadril</span><span class="v">${rcq?rcq.toFixed(2):'—'}</span><span class="s">${rcq?(rcq>0.85?'elevada (> 0,85)':'adequada'):''}</span></div>
 </div>
 ${av.length>1?`<div class="card" style="margin-top:16px"><h2>Evolução</h2><div style="height:260px"><canvas id="ch-peso"></canvas></div></div>`:''}
 <div class="card" style="margin-top:16px"><div class="row between"><h2>Avaliações</h2><button class="btn pri sm" onclick="formAval('${p.id}')">+ Nova avaliação</button></div>
 ${av.length?`<div class="tbl-wrap"><table><thead><tr><th>Data</th><th class="num">Peso</th><th class="num">Altura</th><th class="num">IMC</th><th class="num">Cintura</th><th class="num">Quadril</th><th class="num">% Gordura</th><th>Obs.</th><th></th></tr></thead><tbody>
 ${[...av].reverse().map(a=>`<tr><td>${fd(a.data)}</td><td class="num">${n1(a.peso)}</td><td class="num">${n1(a.altura)}</td><td class="num">${n1(imc(a.peso,a.altura))}</td><td class="num">${n1(a.cintura)}</td><td class="num">${n1(a.quadril)}</td><td class="num">${n1(a.gordura)}</td><td class="small">${esc(a.obs||'')}</td><td class="num"><button class="btn sm ghost" onclick="formAval('${p.id}','${a.id}')">Editar</button></td></tr>`).join('')}
 </tbody></table></div>`:'<div class="empty">Nenhuma avaliação registrada.</div>'}</div>`}
function formAval(pid,id){const p=P(pid);const l=last(byDate(p.avaliacoes))||{};const a=id?p.avaliacoes.find(x=>x.id===id):{data:today(),altura:l.altura};
 openModal(id?'Editar avaliação':'Nova avaliação',`<div class="form">${F({k:'data',l:'Data',t:'date'},a.data)}${F({k:'peso',l:'Peso (kg)',t:'number'},a.peso)}${F({k:'altura',l:'Altura (cm)',t:'number'},a.altura)}${F({k:'gordura',l:'% de gordura',t:'number'},a.gordura)}${F({k:'cintura',l:'Circunferência da cintura (cm)',t:'number'},a.cintura)}${F({k:'quadril',l:'Circunferência do quadril (cm)',t:'number'},a.quadril)}${F({k:'pa',l:'Pressão arterial',ph:'120/80'},a.pa)}${F({k:'obs',l:'Observações',t:'textarea',w:'full'},a.obs)}</div>
 ${id?`<button type="button" class="btn danger ghost sm" style="margin-top:10px" onclick="P('${pid}').avaliacoes=P('${pid}').avaliacoes.filter(x=>x.id!=='${id}');save();closeModal();render()">Excluir avaliação</button>`:''}`,d=>{if(!d.peso||!d.data){toast('Informe data e peso');return false}if(id)Object.assign(a,d);else p.avaliacoes.push({id:uid(),...d})})}

/* ---- Exames ---- */
function tExames(p){const ex=byDate(p.exames).reverse().slice(0,4);
 const groups=[...new Set(LABS.map(l=>l.g))];
 return `<div class="card"><div class="row between"><div><h2 style="margin-bottom:4px">Exames laboratoriais</h2><p class="small muted" style="margin:0">Faixas-alvo orientativas, com foco em fertilidade. Confira sempre a referência do laboratório.</p></div><button class="btn pri sm" onclick="formExame('${p.id}')">+ Lançar exames</button></div>
 ${ex.length?`<div class="tbl-wrap" style="margin-top:14px"><table><thead><tr><th>Marcador</th><th>Alvo</th>${ex.map(e=>`<th class="num"><a href="#" onclick="event.preventDefault();formExame('${p.id}','${e.id}')">${fd(e.data)}</a></th>`).join('')}</tr></thead><tbody>
 ${groups.map(g=>{const rows=LABS.filter(l=>l.g===g&&ex.some(e=>examVal(e,l.k)!==''&&examVal(e,l.k)!=null));if(!rows.length)return '';return `<tr><td colspan="${2+ex.length}" style="background:var(--surface2);font-weight:600;font-size:12px">${g}</td></tr>`+rows.map(l=>`<tr><td>${l.n}</td><td class="small muted">${labRef(l)} ${l.u}</td>${ex.map(e=>{const v=examVal(e,l.k);const f=labFlag(l,v);return `<td class="num"><span class="lab-flag ${f}">${v===''||v==null?'—':n1(v)}${f==='lo'?' ↓':f==='hi'?' ↑':''}</span></td>`}).join('')}</tr>`).join('')}).join('')}
 </tbody></table></div>`:'<div class="empty">Nenhum exame lançado.</div>'}
 </div>`}
function formExame(pid,id){const p=P(pid);const e=id?p.exames.find(x=>x.id===id):{data:today(),v:{}};

 const v={};Object.keys(d).forEach(k=>{if(k.startsWith('v_')&&d[k]!=='')v[k.slice(2)]=d[k]});

/* ---- Gasto energético ---- */
const AF=[[1.2,'Sedentária (1,2)'],[1.375,'Levemente ativa (1,375)'],[1.55,'Moderadamente ativa (1,55)'],[1.725,'Muito ativa (1,725)']];
function calcE(e){const w=+e.peso,h=+e.altura,i=+e.idade;let tmb=0;
 if(e.formula==='harris')tmb=e.sexo==='M'?66.47+13.75*w+5.003*h-6.755*i:655.1+9.563*w+1.85*h-4.676*i;
 else if(e.formula==='manual')tmb=+e.tmbManual||0;
 else tmb=10*w+6.25*h-5*i+(e.sexo==='M'?5:-161);
 const get=tmb*(+e.af||1.2);const kcal=get+(+e.ajuste||0);
 return{tmb,get,kcal,c:kcal*(+e.pc||0)/400,p:kcal*(+e.pp||0)/400,g:kcal*(+e.pg||0)/900,pkg:w?kcal*(+e.pp||0)/400/w:0}}
function tEnergia(p){const a=last(byDate(p.avaliacoes))||{};
 const e=Object.assign({peso:a.peso||'',altura:a.altura||'',idade:age(p.nascimento)||'',sexo:'F',formula:'mifflin',af:1.375,ajuste:0,pc:45,pp:25,pg:30},p.energia||{});
 return `<div class="grid g2"><div class="card"><h2>Parâmetros</h2>
 <form id="enf" class="form" oninput="liveE()" onchange="liveE()">
 ${F({k:'peso',l:'Peso (kg)',t:'number'},e.peso)}${F({k:'altura',l:'Altura (cm)',t:'number'},e.altura)}
 ${F({k:'idade',l:'Idade',t:'number'},e.idade)}${F({k:'sexo',l:'Sexo',t:'select',o:[['F','Feminino'],['M','Masculino (parceiro)']]},e.sexo)}
 ${F({k:'formula',l:'Fórmula',t:'select',o:[['mifflin','Mifflin-St Jeor'],['harris','Harris-Benedict'],['manual','TMB manual (bioimpedância)']]},e.formula)}
 ${F({k:'tmbManual',l:'TMB manual (kcal)',t:'number'},e.tmbManual)}
 ${F({k:'af',l:'Fator de atividade',t:'select',o:AF},e.af)}
 ${F({k:'ajuste',l:'Ajuste (kcal/dia, ±)',t:'number',ph:'ex.: -300'},e.ajuste)}
 <div class="sec-title">Distribuição de macronutrientes (%)</div>
 ${F({k:'pc',l:'Carboidratos %',t:'number'},e.pc)}${F({k:'pp',l:'Proteínas %',t:'number'},e.pp)}${F({k:'pg',l:'Gorduras %',t:'number'},e.pg)}
 </form></div>
 <div class="card"><h2>Resultado</h2><div id="enr"></div>
 <button class="btn pri" style="margin-top:16px" onclick="saveE('${p.id}')">Definir como meta da paciente</button>
 <p class="small muted">A meta definida aparece no plano alimentar para comparar com o que foi prescrito.</p></div></div>`}
function liveE(){const f=$('#enf');if(!f)return;const e=readForm(f);const r=calcE(e);const sum=(+e.pc||0)+(+e.pp||0)+(+e.pg||0);
 $('#enr').innerHTML=`<div class="grid g3" style="gap:10px"><div class="kpi"><span class="l">TMB</span><span class="v" style="font-size:24px">${n0(r.tmb)}</span><span class="l">kcal</span></div><div class="kpi"><span class="l">GET</span><span class="v" style="font-size:24px">${n0(r.get)}</span><span class="l">kcal</span></div><div class="kpi"><span class="l">Meta</span><span class="v" style="font-size:24px;color:var(--brand)">${n0(r.kcal)}</span><span class="l">kcal/dia</span></div></div>
 <table style="margin-top:14px"><thead><tr><th>Macro</th><th class="num">%</th><th class="num">g/dia</th><th class="num">g/kg</th></tr></thead><tbody>
 <tr><td>Carboidratos</td><td class="num">${e.pc}</td><td class="num">${n0(r.c)}</td><td class="num">${e.peso?n1(r.c/e.peso):'—'}</td></tr>
 <tr><td>Proteínas</td><td class="num">${e.pp}</td><td class="num">${n0(r.p)}</td><td class="num">${e.peso?n1(r.pkg):'—'}</td></tr>
 <tr><td>Gorduras</td><td class="num">${e.pg}</td><td class="num">${n0(r.g)}</td><td class="num">${e.peso?n1(r.g/e.peso):'—'}</td></tr></tbody></table>
 ${sum!==100?`<div class="alert warn" style="margin-top:10px">A soma dos macros está em ${sum}%. Ajuste para 100%.</div>`:''}`}
function saveE(pid){const p=P(pid);const e=readForm($('#enf'));const r=calcE(e);p.energia=e;p.meta={kcal:Math.round(r.kcal),c:Math.round(r.c),p:Math.round(r.p),g:Math.round(r.g)};save();toast('Meta definida: '+n0(r.kcal)+' kcal')}

 if(!pl)return list+`<div class="card empty">Nenhum plano alimentar ainda. Crie o primeiro, ele já vem com as 6 refeições do dia.</div>`;
 UI.planId=pl.id;const t=planTotals(pl);const m=p.meta||{};
 const bar=(l,v,alvo,u)=>{const pct=alvo?Math.min(130,v/alvo*100):0;const col=!alvo?'var(--muted)':pct>110||pct<90?'var(--gold)':'var(--sage)';return `<div class="bar-row"><span>${l}</span><div class="progress"><i style="width:${Math.min(100,pct)}%;background:${col}"></i></div><span class="num small">${n0(v)}${alvo?' / '+n0(alvo):''} ${u}</span></div>`};
 const kc=t.c*4+t.p*4+t.g*9||1;
 chart('ch-macro',{type:'doughnut',data:{labels:['Carboidratos','Proteínas','Gorduras'],datasets:[{data:[t.c*4,t.p*4,t.g*9].map(x=>Math.round(x/kc*100)),backgroundColor:[css('--gold'),css('--ink'),css('--sage')],borderWidth:0}]},options:{cutout:'68%',plugins:{legend:{position:'bottom',labels:{boxWidth:10}},tooltip:{callbacks:{label:c=>`${c.label}: ${c.raw}%`}}},maintainAspectRatio:false}});
 const foodsOpt=allFoods().map(f=>`<option value="${esc(f.nome)}">`).join('');
 const tagsPresent=Object.keys(TAGS).map(k=>[k,t.tags[k]||0]);
 return list+`<datalist id="foodlist">${foodsOpt}</datalist>
 <div class="grid" style="grid-template-columns:minmax(0,1fr) 300px;align-items:start" id="plan-grid">
 <div>
  <div class="card" style="margin-bottom:14px"><div class="row between">
   <input style="font-family:var(--serif);font-size:18px;font-weight:600;max-width:360px;border-color:transparent;padding:4px 6px" value="${esc(pl.nome)}" onchange="planSet('nome',this.value)">
   <div class="row"><button class="btn sm" onclick="addMeal()">+ Refeição</button><button class="btn sm" onclick="dupPlan()">Duplicar</button><button class="btn sm pri" onclick="printPlan('${p.id}')">Imprimir / PDF</button><button class="btn sm ghost danger" onclick="delPlan()">Excluir</button></div></div>
   <div class="small muted" style="padding:0 6px">Criado em ${fd(pl.data)}${phase(pl.fase)?' · '+esc(phase(pl.fase).nome):''}</div>
  </div>
  ${pl.refeicoes.map((ml,mi)=>{const mt=mealTotals(ml);return `<div class="meal">
   <div class="meal-head"><input type="time" value="${ml.hora||''}" onchange="mealSet(${mi},'hora',this.value)" style="width:96px"><input value="${esc(ml.nome)}" onchange="mealSet(${mi},'nome',this.value)" style="flex:1;min-width:140px">
   <span class="small muted num">${n0(mt.kcal)} kcal · C ${n0(mt.c)} · P ${n0(mt.p)} · G ${n0(mt.g)}</span>
   <button class="btn sm ghost" title="Subir" onclick="moveMeal(${mi},-1)">↑</button><button class="btn sm ghost danger" title="Remover refeição" onclick="delMeal(${mi})">✕</button></div>
   ${ml.itens.length?`<div class="tbl-wrap"><table><thead><tr><th>Alimento</th><th style="width:150px">Medida caseira</th><th class="num" style="width:90px">g/ml</th><th class="num">kcal</th><th class="num">C</th><th class="num">P</th><th class="num">G</th><th></th></tr></thead><tbody>
   ${ml.itens.map((it,ii)=>{const f=food(it.f);if(!f)return '';const k=(+it.g||0)/100;return `<tr><td>${esc(f.nome)} <span>${f.tags.map(tagHtml).join(' ')}</span></td><td><input value="${esc(it.m||'')}" placeholder="ex.: 2 col. sopa" onchange="itemSet(${mi},${ii},'m',this.value)"></td><td><input type="number" step="any" class="num" value="${it.g}" onchange="itemSet(${mi},${ii},'g',+this.value)"></td><td class="num">${n0(f.kcal*k)}</td><td class="num">${n1(f.c*k)}</td><td class="num">${n1(f.p*k)}</td><td class="num">${n1(f.g*k)}</td><td class="num"><button class="btn sm ghost danger" onclick="delItem(${mi},${ii})">✕</button></td></tr>`}).join('')}
   </tbody></table></div>`:''}
   <div class="add-row"><input list="foodlist" id="af-${mi}" placeholder="Buscar alimento…" onkeydown="if(event.key==='Enter')addItem(${mi})"><input type="number" id="ag-${mi}" value="100" placeholder="g"><input id="am-${mi}" placeholder="Medida caseira" onkeydown="if(event.key==='Enter')addItem(${mi})"><button class="btn sm" onclick="addItem(${mi})">Adicionar</button></div>
   <div style="padding:0 14px 12px"><textarea rows="1" placeholder="Substituições e observações desta refeição…" onchange="mealSet(${mi},'obs',this.value)">${esc(ml.obs||'')}</textarea></div>
  </div>`}).join('')}
  <div class="card"><h3>Orientações gerais do plano</h3><textarea rows="4" placeholder="Ex.: beber 2,5 L de água, preferir orgânicos, evitar plástico aquecido…" onchange="planSet('obs',this.value)">${esc(pl.obs||'')}</textarea></div>
 </div>
 <div style="position:sticky;top:16px" class="grid">

   <div class="kpi" style="margin-bottom:10px"><span class="v">${n0(t.kcal)} <small style="font-size:14px">kcal</small></span><span class="l">${m.kcal?`meta ${n0(m.kcal)} kcal (${Math.round(t.kcal/m.kcal*100)}%)`:'sem meta definida'}</span></div>

   <div style="height:170px;margin-top:10px"><canvas id="ch-macro"></canvas></div>
  </div>

   ${tagsPresent.map(([k,c])=>`<div class="row between" style="padding:4px 0"><span>${tagHtml(k)}</span><span class="small ${c?'':'muted'}" style="${c?'':'color:var(--danger)'}">${c?c+' alimento'+(c>1?'s':''):'ausente'}</span></div>`).join('')}
  </div>
 </div></div>
 <style>@media(max-width:1180px){#plan-grid{grid-template-columns:1fr!important}#plan-grid>div:last-child{position:static!important}}</style>`}
function curPlan(){const p=P(UI.pid);return p.planos.find(x=>x.id===UI.planId)}
function commit(){save();render()}
function newPlan(pid){const p=P(pid);const pl={id:uid(),nome:'Plano '+(p.planos.length+1),data:today(),fase:p.fase,refeicoes:MEALS_DEFAULT.map(([nome,hora])=>({nome,hora,itens:[],obs:''})),obs:''};p.planos.push(pl);UI.planId=pl.id;commit()}
function dupPlan(){const p=P(UI.pid);const c=JSON.parse(JSON.stringify(curPlan()));c.id=uid();c.nome+=' (cópia)';c.data=today();p.planos.push(c);UI.planId=c.id;commit();toast('Plano duplicado')}
function delPlan(){if(!confirm('Excluir este plano?'))return;const p=P(UI.pid);p.planos=p.planos.filter(x=>x.id!==UI.planId);UI.planId=null;commit()}
function planSet(k,v){curPlan()[k]=v;commit()}
function mealSet(mi,k,v){curPlan().refeicoes[mi][k]=v;commit()}
function addMeal(){curPlan().refeicoes.push({nome:'Nova refeição',hora:'',itens:[],obs:''});commit()}
function delMeal(mi){if(curPlan().refeicoes[mi].itens.length&&!confirm('Remover esta refeição e seus alimentos?'))return;curPlan().refeicoes.splice(mi,1);commit()}
function moveMeal(mi,d){const r=curPlan().refeicoes;const j=mi+d;if(j<0||j>=r.length)return;[r[mi],r[j]]=[r[j],r[mi]];commit()}
function addItem(mi){const n=$('#af-'+mi).value.trim().toLowerCase();if(!n)return;const f=allFoods().find(x=>x.nome.toLowerCase()===n)||allFoods().find(x=>x.nome.toLowerCase().includes(n));if(!f){toast('Alimento não encontrado. Cadastre em Alimentos.');return}
 curPlan().refeicoes[mi].itens.push({f:f.id,g:+$('#ag-'+mi).value||100,m:$('#am-'+mi).value});commit();setTimeout(()=>{const i=$('#af-'+mi);i&&i.focus()},20)}
function itemSet(mi,ii,k,v){curPlan().refeicoes[mi].itens[ii][k]=v;commit()}
function delItem(mi,ii){curPlan().refeicoes[mi].itens.splice(ii,1);commit()}
function printPlan(pid){const p=P(pid);const pl=curPlan();const s=S.settings;
 $('#print').innerHTML=`<div class="ph"><div><h1 style="font-family:var(--serif);color:#8A4630">${esc(s.clinica)}</h1><div>${esc(s.nutri)} · ${esc(s.crn)}</div>${s.telefone||s.instagram?`<div style="color:#777">${esc(s.telefone)} ${esc(s.instagram)}</div>`:''}</div><div style="text-align:right"><b>${esc(p.nome)}</b><div>${esc(pl.nome)}</div><div style="color:#777">${fd(pl.data)}${phase(pl.fase)?' · '+esc(phase(pl.fase).nome):''}</div></div></div>
 ${pl.refeicoes.filter(m=>m.itens.length||m.obs).map(m=>`<div class="pm"><h3>${m.hora?m.hora+' · ':''}${esc(m.nome)}</h3><ul>${m.itens.map(it=>{const f=food(it.f);return f?`<li>${it.m?esc(it.m)+' de ':''}${esc(f.nome)} <span style="color:#888">(${n0(it.g)} g)</span></li>`:''}).join('')}</ul>${m.obs?`<p style="margin:6px 0 0;color:#555"><i>Substituições:</i> ${esc(m.obs)}</p>`:''}</div>`).join('')}
 ${(p.suplementos||[]).length?`<div class="pm"><h3>Suplementação</h3><ul>${p.suplementos.map(x=>`<li><b>${esc(x.nome)}</b>${x.dose?' — '+esc(x.dose):''}${x.horario?' · '+esc(x.horario):''}${x.obs?' · '+esc(x.obs):''}</li>`).join('')}</ul></div>`:''}
 ${pl.obs?`<div class="pm"><h3>Orientações gerais</h3><p style="white-space:pre-wrap">${esc(pl.obs)}</p></div>`:''}
 <div class="pf">${esc(s.metodo)} · Plano individual e intransferível. Não altere sem orientação profissional.</div>`;
 window.print()}

function tScore(p){p.scores=p.scores||[];const sc=byDate(p.scores);const l=last(sc);
 if(sc.length>1)chart('ch-score',{type:'line',data:{labels:sc.map(s=>fdShort(s.data)),datasets:[{data:sc.map(scorePct),borderColor:css('--sage'),backgroundColor:css('--sage-soft'),fill:true,tension:.35,pointRadius:4}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'}}}}});
 const lp=l?scorePct(l):null;
 return `<div class="grid g2"><div class="card"><h2>Novo questionário</h2><p class="small muted" style="margin-top:-6px">Hábitos ligados à fertilidade. Aplique na consulta e reaplique a cada retorno para medir a evolução.</p>
 <form id="scf">${F({k:'data',l:'Data',t:'date'},today())}
 ${SCORE.map((q,i)=>`<div class="score-q"><span>${q}</span><div class="seg">${[['0','Nunca'],['1','Às vezes'],['2','Sempre']].map(([v,t])=>`<label><input type="radio" name="q${i}" value="${v}" ${(l?.resp?.['q'+i]??'1')==v?'checked':''}><span>${t}</span></label>`).join('')}</div></div>`).join('')}
 </form><button class="btn pri" style="margin-top:14px" onclick="saveScore('${p.id}')">Salvar pontuação</button></div>
 <div class="grid" style="align-content:start">

function clearDemo(){const ids=S.pacientes.filter(p=>p.demo).map(p=>p.id);S.pacientes=S.pacientes.filter(p=>!p.demo);S.agenda=S.agenda.filter(a=>!ids.includes(a.pid));save();render();toast('Exemplos removidos')}
